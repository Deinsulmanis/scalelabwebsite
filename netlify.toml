# THROWAWAY FORWARDING PROBE. Deploy-preview only; never merged.
# Verifies how Netlify forwards a same-origin POST to an external service
# before the staffing collector is built. Target is a public echo service;
# every request is synthetic.

# Signed forwarding: Netlify adds an x-nf-sign JWS using LP_PROBE_SIGNING_SECRET
# (set for the deploy-preview context only).
[[redirects]]
  from = "/staffing/api/lp-probe"
  to = "https://httpbin.org/anything/scalelab-netlify-probe-signed"
  status = 200
  force = true
  signed = "LP_PROBE_SIGNING_SECRET"

# Custom request header, tested separately in case it can't combine with signing.
[[redirects]]
  from = "/staffing/api/lp-probe-headers"
  to = "https://httpbin.org/anything/scalelab-netlify-probe-headers"
  status = 200
  force = true
  headers = { X-Probe-Custom = "custom-header-ok" }
